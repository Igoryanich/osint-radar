# Source registry. Edit freely: the file is synced into the DB on every run;
# a source removed here is disabled (its history is kept).
#
# kind      — collector: github_trending | github_search | hn | reddit | rss | telegram
# platform  — where it is from (shown to the model): github | hn | reddit | press | blog | telegram | mastodon | producthunt
# focused   — true = an OSINT-only source, no keyword pre-filter; false = general source, only OSINT-related items are kept
# config.standalone — true = an article that links to no repo/site is a story of its own (a technique guide,
#             an investigation). Reddit and HN threads are always eligible. Other blogs/press only attach as mentions.
#
# Every URL below answered with fresh items on 2026-11-01 (Reddit: checked from GitHub Actions only —
# a home IP gets 403/429). Not collected (no free, stable API): X/Twitter, Discord,
# YouTube view counts.
# Dropped after checking: gijn.org, trace-labs.com, hackers-arise.com (403), osintcurio.us, osintcombine.com (no feed),
# infosec.exchange tag feeds (empty to anonymous readers), sector035.nl (no posts since 2024),
# maltego.com (4 MB feed), restofworld.org (malformed XML), secjuice.com and unishka.substack.com (403 from Actions).

sources:
