name: radar

# OSINT Radar: collect → measure → model scan → posts → digest after 21:00 → publish, once an hour.
# Hourly matters: 24h/72h velocity is computed from our own snapshots of star/point/upvote counters.
# State (SQLite) lives on the `state` branch as a single force-pushed commit, so history never grows.
#
# GitHub ran the hourly schedule only every 7–8 hours for this repo (2026-11-01…03): no evening run → no digest,
# few posts. So one job now keeps going for ~5.5 hours, running a cycle every hour and saving state after each.
# Schedule triggers that arrive meanwhile wait in the concurrency queue, so the next job starts as this one ends.
# Keep the repo public: Actions minutes are then free and unlimited (a job running around the clock would need
# ~43 000 minutes a month; a private repo gets 2 000).
#
# Repository secrets:   GEMINI_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL_ID   (optional: GEMINI_PAID_API_KEY)
# Repository variables: DRY_RUN (default true — set to false to start posting), CHANNEL_NAME,
#                       PAID_DAILY_BUDGET_EUR, MAX_POSTS_PER_DAY, POST_THRESHOLD, MAX_POSTS_PER_RUN

on:
  schedule:
    # Two triggers an hour: GitHub drops many scheduled runs; any one that lands queues the next job.
    - cron: "12 * * * *"
    - cron: "42 * * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "cycle = the usual run (hourly cycles for ~5.5 h); digest-now = build and send today's digest right away"
        type: choice
        options: [cycle, digest-now]
        default: cycle

concurrency:
  group: radar-state   # one writer to the state branch at a time
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
      PAID_DAILY_BUDGET_EUR: ${{ vars.PAID_DAILY_BUDGET_EUR || '0.24' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME || '' }}
      MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY || '' }}
      MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '' }}
      POST_THRESHOLD: ${{ vars.POST_THRESHOLD || '' }}
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      # The workflow's own token: higher GitHub Search/API limits for the collectors.
      GITHUB_TOKEN: ${{ github.token }}
      DATABASE_PATH: data/radar.db
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --omit=dev

      - name: Restore state
        run: |
          mkdir -p data
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show origin/state:radar.db > data/radar.db
            echo "restored $(du -h data/radar.db | cut -f1)"
          else
            echo "no state branch yet — starting fresh"
          fi

      - name: Cycles (hourly, ~5.5 h)
        if: inputs.task != 'digest-now'
        run: |
          deadline=$((SECONDS + 330 * 60))
          while :; do
            start=$SECONDS
            echo "::group::cycle $(date -u +%FT%TZ)"
            node src/cli.ts cycle || echo "cycle failed (exit $?) — state is still saved, next cycle in an hour"
            echo "::endgroup::"
            bash scripts/save-state.sh "${{ github.token }}" "${{ github.repository }}" || echo "state save failed"
            next=$((start + 3600))
            # Stop if the next cycle (up to ~25 min) would not finish before the deadline.
            [ $((next + 25 * 60)) -le $deadline ] || break
            sleep $((next > SECONDS ? next - SECONDS : 0))
          done

      # A digest sent this way counts as today's: the evening run will not send a second one.
      - name: Digest now
        if: inputs.task == 'digest-now'
        run: node src/cli.ts digest && node src/cli.ts publish

      - name: Latest texts (log)
        if: always()
        run: node src/cli.ts posts 3 || true

      - name: Save state
        if: always()
        run: bash scripts/save-state.sh "${{ github.token }}" "${{ github.repository }}"
